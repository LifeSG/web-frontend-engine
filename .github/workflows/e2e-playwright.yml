name: E2E Tests

on:
  push:
    branches:
      - main
      - "release/**"
      - "!release/**-published"
      - "!release/v1.**"
      - "!release/v2.**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install E2E Next.js App Dependencies
        run: npm --prefix e2e/nextjs-app ci

      - name: Run E2E Tests
        run: ./scripts/e2e-ci.sh

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
